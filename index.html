<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="utf-8" />
</head>
<body>
<h1>Music Party</h1>

<h2> Welcome To The Lobby!</h2>



    <label for="uname">Player Name:</label>
    <input type="text" id="uname" placeholder="Superwinner3000" required><br><br>

<p>customize your photo!</p>

<form>
    <input type="file" id="pfp" name="pfpname" accept="image/*">


</form>

<h1>NAME:</h1>
<h2 id="playername"></h2>
<img id="pfpDisplay" src="resources/images/oh_no.png" style="max-width: 126px; padding: 10px;">
<br>
<button id="ready">Ready Up</button>

<p id="status">not ready!</p>



<div class="container">

<div></div>



</div>

<script>
    pfp.onchange = evt =>{
    const [file] = pfp.files
    if (file){
        document.getElementById("pfpDisplay").src=URL.createObjectURL(file);
    }
    }

</script>

<script>
    const status = document.getElementById("status");
    const readybtn = document.getElementById("ready");
    ready = false;

    readybtn.addEventListener('click', function() {
        ready = !ready;
        if(ready){
            status.innerHTML = "ready!"
        }
        if(!ready){
            status.innerHTML = "not ready!"
        }
        
    })
</script>

<script>
    const name = document.getElementById("uname");
    document.getElementById("playername").innerHTML = name.placeholder;
   name.addEventListener("keyup", () => {
    document.getElementById("playername").innerHTML = name.value;
    console.log(name);
   });
</script>

<script>
    
</script>

</body>



</html>
