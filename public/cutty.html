<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<h1>Cut The Right Wire</h1>
<div>Brownies: <span id="counter"></span></div>
<button id="brownie" style="border: none; background-color: transparent;"><img src="/images/Brownie_transparent.png"></button>

<div class="flex-container-column" style="position: relative; width: min(20vw);">
<div>mom's oven
<div>adds one brownie per second</div>
</div>
</div>

<footer>
Ver 0.0.1
</footer>
<script>

const counter = document.getElementById('counter');

counter.innerText = 0;

document.getElementById('brownie').onclick =  function() {counter.innerText ++;

};
</script>

<script>
    document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
    });
</script>
</body>
