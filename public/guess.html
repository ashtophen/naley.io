<body>
<h1>Guess The Number!</h1>
<div>
<form action="" onsubmit="return false">
<input id="numinput" type="number">
<button type="submit" id="enter">enter</button>
</form>
<p id="response"> </p>
</div>
<footer>
Ver 0.0.1
</footer>
<script src=""></script>
<script>
const num = 567.8922849427;
const truenum = 45.283;
const inputnum = document.getElementById("numinput");
const response = document.getElementById("response");
const responses = ["No", "Nope", "That's not it", "Not even close", "Not Quite"];
const enter = document.getElementById('enter');

inputnum.addEventListener("input", validate);
enter.addEventListener("click", validate);



	function validate() {
    const userValue = parseFloat(inputnum.value);
		if (userValue !== num || userValue !== truenum){
			response.innerText = randomItem(responses, responses.length);
		
		}
    if(userValue == num){
      response.innerText = "Did you really think I'd just leave the answer in the code?";
    }
    if(userValue == truenum){
      response.innerText = "seriously? again?";
    }
    if(userValue == "e"){
      response.innerText = "A fun one, but still no.";
    }
	};
function randomItem (array, int){
	let randIndex = Math.floor(Math.random() * int);
	return array[randIndex];
}
</script>

<script>
    document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
    });
</script>
</body>
