<!DOCTYPE html>
<head>

</head>
<body>
    <div style="height: 90vh; display: flex; gap: 10px; flex-direction: column; justify-content: center; align-content: center;"class="flexcontainer-row">
        <div style="align-self: center;"id="speaker"></div>
        <button style="width: 20vw; align-self: center;"onclick="prompt()">Prompt</button>
    </div>
    <a style="position: absolute; bottom: 10vh;" href="/">Return Home</a>
    <script>
        const phrases = ["No", "I don't want to talk.", "Leave me be.", ">~<", "~_~", "-_-","...", "rm -rf --no-preserve-root /", "Hacking the pentagon..."]
        const text = document.getElementById("speaker");
        let bob = randomPhrase();
        let i = 0;
        function typeWriter(){
            if (i< bob.length){
                text.textContent += bob.charAt(i);
                i++;
                setTimeout(typeWriter, 100);
            }
        }
        function randomPhrase(){
            let randomIndex = Math.floor(Math.random() * phrases.length);
            return phrases[randomIndex];
        }
        typeWriter();
        function prompt() {
            bob = randomPhrase();
            i = 0;
            text.textContent = "";
            typeWriter();
        }

    </script>
</body>
