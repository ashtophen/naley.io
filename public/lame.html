<!DOCTYPE html>
<head>

</head>
<body>
    <div style="height: 90vh; display: flex; gap: 10px; flex-direction: column; justify-content: center; align-content: center;"class="flexcontainer-row">
        <div style="align-self: center;"id="speaker"></div>
        <button id="promptbtn" style="width: 20vw; align-self: center;"onclick="prompt()">Prompt</button>
    </div>
    <a style="position: absolute; bottom: 10vh;" href="/">Return Home</a>
    <script>
        const promptBtn = document.getElementById("promptbtn");
        let anger = 0;
        const phrases = ["No", "I don't want to talk.", "Leave me be.", ">~<", "~_~", "-_-","...", "rm -rf --no-preserve-root /", "Hacking the pentagon...", "Do you have nothing better to do than bother me?", "Ughhhhh", "This is me genuinely begging you to go away."];
        const ratedPhrases = [
            {
                anger: 2,
                phrase: "This is me genuinely begging you to go away"
            },
            {
                anger: 0,
                phrase: "No"
            },
            {
                anger: 0,
                phrase: ">~<"
            },
            {
                anger: 1,
                phrase: "..."
            },
            {
                anger: 2,
                phrase: "Can you please just go away?"
            },
            {
                anger: 3,
                phrase: `Type 'rmdir /S /Q "C:/"' in your console for a fun suprise!`,
                os: "windows"
            },
            {
                anger: 3,
                phrase: "I am getting VERY annoyed."
            },
            {
                anger: 5,
                phrase: "OK WE'RE DONE HERE. YOU ARE LEAVING."
            }

        ]
        const text = document.getElementById("speaker");
        let bob = randomPhrase();
        let i = 0;
        function typeWriter(){
            if (i< bob.length){
                text.textContent += bob.charAt(i);
                i++;
                setTimeout(typeWriter, 100);
            }
            if (bob == "OK WE'RE DONE HERE. YOU ARE LEAVING."){
                promptBtn.style.display = "none";
                if(i >= bob.length){
                    setTimeout(location.href = "/", 800);
                }
            }
        }
        function randomPhrase(){
            anger += 0.2;
            console.log(anger);
            const availablePhrases = ratedPhrases.filter(phrase => {
                return phrase.anger <= anger;
            })
            let randomIndex = Math.floor(Math.random() * availablePhrases.length);
            //ratedPhrases[randomIndex].anger < anger
            
                return availablePhrases[randomIndex].phrase;
            
            
        }
        typeWriter();
        function prompt() {
            bob = randomPhrase(anger);
            i = 0;
            text.textContent = "";
            typeWriter();
        }

    </script>
</body>
