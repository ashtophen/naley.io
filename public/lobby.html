<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<h1 style="margin: 10px">Music Party</h1>
<div id="pregame">
<h2> Welcome To The Lobby!</h2>
<h2>NAME:</h2>
<h2 id="playername"></h2>


<p>customize your photo!</p>
<div class="flex-container-column" id="player-display">
  <div>PLAYERS:</div>

  

</div>
<div id="photoselect">
  <form>
    <input type="file" id="pfp" name="pfpname" accept="image/*">
  </form>
  <img id="pfpDisplay" src="public/images/oh_no.png" style="max-width: 126px; max-height: 10vh; padding: 10px;">
  <br>
</div>
<p>Or, Draw Your Picture!</p>

<button id="drawtoggle" ontouchstart="">DRAW!</button>

<div class="easle" id="easle">
  <canvas id="canvas"></canvas>
    <div class="palette">
      <input type="range" id="brush-size" min="1" max="50" value="5">
      <input type="color" id="color-picker">
      <button ontouchstart="" id="pen">pen</button>
      <button ontouchstart="" id="eraser">eraser</button>
      <button ontouchstart="" id="clear-canvas">Clear</button>
    </div>
  </div>




<button id="ready" ontouchstart="">Ready Up</button>

<p id="status">not ready!</p>



<div class="container">

</div>
</div>

<div id="rounds" style="display: none;">
  <h1 id="round">Round 1</h1>
  <div class="flexcontainer" id="choice_select">


  </div>
</div>

<div class="chat">
<ul id="messages"></ul>
<form id="form" action="">
    <input id="input" autocomplete="off" /><button class="send" ontouchstart="">Send</button>
</form>
</div>




<script src="/socket.io/socket.io.js"></script>

<script>

</script>


<script>

let counter = 0;
      
      const socket = io({
        auth: {
          serverOffset: 0,
        },
        // enable retries
        ackTimeout: 10000,
        retries: 3,
      });
//variables for chat messaging
const form = document.getElementById('form');
const input = document.getElementById('input');
const messages = document.getElementById('messages');
//player stuff
const user = document.getElementById("playername");
const pfp = document.getElementById('pfp');
const playerdisplay = document.getElementById('player-display');
var players = [];
//toggle photo/drawing variables
const drawtoggle = document.getElementById('drawtoggle');
const photoselect = document.getElementById('photoselect');
const easle = document.getElementById('easle');

  drawtoggle.onclick = function() {
    if(drawtoggle.innerText == "DRAW!"){
    easle.style.display = "block";
    photoselect.style.display = "none";
    drawtoggle.innerText = "Choose File!";
    }
    else{
      easle.style.display = "none";
    photoselect.style.display = "block";
    drawtoggle.innerText = "DRAW!";
    }
  }

    //set playername from 'user' in localstorage
    user.innerText = localStorage.getItem("user");

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          if (input.value) {
            // compute a unique offset
            const clientOffset = `${socket.id}-${counter++}`;
            socket.emit('chat message', input.value, clientOffset, localStorage.getItem('user'), localStorage.getItem('color'));
            input.value = '';
          }
        });
      
        socket.on('chat message', (msg, serverOffset) => {
          const item = document.createElement('li');
          item.innerHTML = msg;
          messages.appendChild(item);
          messages.scrollTo(0, messages.scrollHeight);
          socket.auth.serverOffset = serverOffset;
        });

        pfp.onchange = evt =>{
    const [file] = pfp.files
    if (file){
        console.log(file);
        document.getElementById("pfpDisplay").src=URL.createObjectURL(file);
        socket.emit('pfp update', file, localStorage.getItem('uuid'));
    }
    };

    socket.on('pfp update', (file, uuid, name) => {
      const blob = new Blob([file]);
      const img = document.createElement('img');
      const item = document.createElement('div');
      console.log(playerdisplay.children);

        if (playerdisplay.querySelector(`[data-uuid=_${uuid}]`)) {
          playerdisplay.querySelector(`[data-uuid=_${uuid}]`).children[0].src=URL.createObjectURL(blob);
        }
        else{
          item.style.maxWidth = '100%';
          item.style.justifySelf ='center';
          item.style.padding = '8px';
          item.style.display = 'block';
          item.classList.add('flexcontainer');
          item.dataset.uuid = "_" + uuid;
          item.innerText = name + ":";
          img.style.display = 'block';
          img.style.justifySelf = "center";
          img.style.width = 'min(16vw, 126px)';
          console.log(file);
          img.src=URL.createObjectURL(blob);
          playerdisplay.appendChild(item).appendChild(img);
        }
        if (!players.some(player => player.uuid === uuid)){
            players.push({name: `${name}`, uuid: `${uuid}`, spotifyinfo: localStorage.getItem('topTracks')});
            socket.emit('playersUpdate', players);
        }
      
      });

      //ready button logic
      const status = document.getElementById("status");
      const readybtn = document.getElementById("ready");
    ready = false;
      socket.emit('ready change', ready, localStorage.getItem('uuid'));
    readybtn.addEventListener('click', function() {
        ready = !ready;
        if(ready){
            status.innerHTML = "ready!";
            socket.emit('ready change', ready, localStorage.getItem('uuid'));
        }
        if(!ready){
            status.innerHTML = "not ready!";
            socket.emit('ready change', ready, localStorage.getItem('uuid'));

        }
      });
        //recieving ready changes
        socket.on('ready change', (ready, uuid) => {
          console.log(ready);
          if(ready){ 
            if(playerdisplay.querySelector(`[data-uuid=_${uuid}]`)){
              console.log(uuid);
              playerdisplay.querySelector(`[data-uuid=_${uuid}]`).style.backgroundColor = 'green';
            }
          }
          if(!ready){
            console.log('made it');
            if(playerdisplay.querySelector(`[data-uuid=_${uuid}]`)){
              playerdisplay.querySelector(`[data-uuid=_${uuid}]`).style.backgroundColor = 'transparent';
            }
          }

        });
  socket.on('gamestart', () => {
    document.getElementById('pregame').style.display = "none";
    document.getElementById('rounds').style.display = "block";
  });
  socket.on('roundchange', (currRound) => {
    document.getElementById('round').innerText = `round ${currRound}`;
  });
  socket.on('roundOptions', (options) => {
    const choice_select = document.getElementById('choice_select');
    choice_select.innerHTML = '';
    options.forEach((option, i) => {
      const button = document.createElement('button');
      button.innerText = options[i];
      button.id = `choice${i}`;
      button.addEventListener('click', function() {
        socket.emit('answerSubmit', options[i], localStorage.getItem('uuid'));
        choice_select.innerHTML = '';
      });
      choice_select.appendChild(button);
    });
    

  });
  
  socket.emit('pfp update', 'filler', localStorage.getItem('uuid'));
</script>

</html>
