});

<script>
	async function loadTextFile(filePath, elementId) {
  try {
    const response = await fetch(filePath);
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    const text = await response.text();
    // Use .textContent to prevent HTML interpretation of the text file content
    document.getElementById(elementId).innerHTML = marked.parse(text);
  } catch (error) {
    console.error('Error fetching the file:', error);
    document.getElementById(elementId).textContent = 'Failed to load content.';
  }
}
loadTextFile("./public/docs/brownietoucher/changes.md", "changes");

document.getElementById("modal").onclick = function(event) {

	document.getElementById("modal").style.display = "none";}
}
